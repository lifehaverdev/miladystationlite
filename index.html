    <!-- CDN deps for PPO game (heavy libs, loaded globally) -->
    <script src="https://unpkg.com/interactjs@1.10.19/dist/interact.min.js" defer></script>
    <script src="https://unpkg.com/web3@1.10.0/dist/web3.min.js" defer></script>
  </head>
  <body>
    <!-- Handle SPA redirect from 404.html (GitHub Pages) -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
